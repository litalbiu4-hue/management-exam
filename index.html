<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מאגר שאלות – שיטות וכלי ניהול מתקדמים</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: one reading column like an exam booklet; sticky control strip; answer-sheet bubbles א–ה per question */
:root{
  --paper:#f6f7fa; --sheet:#ffffff; --ink:#1b2333; --muted:#5b6475; --line:#dde1ea;
  --accent:#2c46a0; --accent-soft:#e7ebf8; --ok:#1d7a4c; --ok-soft:#e3f3ea; --bad:#b3342b; --bad-soft:#f8e5e3;
  --chip:#eef0f5;
  --f-display:"Frank Ruhl Libre","David","Times New Roman",serif;
  --f-body:"Assistant","Arial Hebrew","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12161f; --sheet:#1a202c; --ink:#e7eaf1; --muted:#a2aabb; --line:#2c3445;
  --accent:#8ea3f0; --accent-soft:#25304f; --ok:#5fcf95; --ok-soft:#183427; --bad:#f08a80; --bad-soft:#3a1f1d; --chip:#232a38; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161f; --sheet:#1a202c; --ink:#e7eaf1; --muted:#a2aabb; --line:#2c3445;
  --accent:#8ea3f0; --accent-soft:#25304f; --ok:#5fcf95; --ok-soft:#183427; --bad:#f08a80; --bad-soft:#3a1f1d; --chip:#232a38; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;direction:rtl}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:28px 64px}
header h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,4vw,2.3rem);line-height:1.2;margin:0;text-wrap:balance}
header p{margin:.4rem 0 0;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:.95rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:12px;margin-top:18px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lbl{font-size:.8rem;color:var(--muted);letter-spacing:.04em;margin-inline-end:4px}
button{font:inherit;cursor:pointer;color:inherit}
.tab,.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:4px 12px;font-size:.92rem}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip .n{font-variant-numeric:tabular-nums;opacity:.7;margin-inline-start:4px;font-size:.8rem}
.tab:focus-visible,.chip:focus-visible,.opt:focus-visible,.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.act{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:6px 14px;font-weight:600}
:root[data-theme="dark"] .act{color:#10162a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .act{color:#10162a}}
.act.ghost{background:transparent;color:var(--accent)}
.note{font-size:.9rem;color:var(--muted)}
#list{display:grid;gap:14px;margin-top:18px}
.q{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.qhead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.8rem;color:var(--muted);margin-bottom:6px}
.num{font-family:var(--f-display);font-weight:700;color:var(--ink);font-size:1rem;font-variant-numeric:tabular-nums}
.tag{background:var(--chip);border-radius:4px;padding:1px 7px}
.tag.app{background:var(--accent-soft);color:var(--accent)}
.qt{font-weight:700;font-size:1.05rem;margin:0 0 10px;text-wrap:pretty}
.opts{display:grid;gap:6px;list-style:none;margin:0;padding:0}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 8px}
.opt:hover{background:var(--chip)}
.bub{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-weight:700;font-size:.85rem;line-height:1;margin-top:1px}
.opt.sel .bub{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt[disabled]{cursor:default}
.opt[disabled]:hover{background:inherit}
.opt.right[disabled]:hover{background:var(--ok-soft)} .opt.wrong[disabled]:hover{background:var(--bad-soft)}
.exp{margin-top:10px;padding:10px 12px;border-inline-start:3px solid var(--accent);background:var(--accent-soft);border-radius:4px;font-size:.95rem}
.exp b{color:var(--accent)}
.verdict{font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.score{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.score .big{font-family:var(--f-display);font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.more{display:flex;justify-content:center;margin-top:18px}
@media (max-width:640px){body{font-size:16px}.q{padding:14px}.controls{position:static}}
@media (prefers-reduced-motion:no-preference){.opt{transition:background .12s}}

.sitenav{display:flex;gap:16px;margin-bottom:16px}.sitenav a{color:var(--accent);font-weight:600}</style>
</head>

 "תכנון", "kind": "ידע", "q": "מהו MBO?", "opts": ["ניהול על פי יעדים – שיטה שבה מנהלים ועובדים קובעים במשותף יעדים, תוכניות, מעקב והערכה", "ניהול על פי חריגים", "מודל לניהול קונפליקטים", "שיטת בקרה בירוקרטית", "מודל לשינוי ארגוני"], "ans": 0, "exp": "MBO – Management By Objectives: קביעה משותפת של יעדים ולוחות זמנים ומעקב משותף."}, {"topic": "תכנון", "kind": "ידע", "q": "מהו הסדר הנכון של ארבעת שלבי ה־MBO?", "opts": ["פיתוח תוכניות, קביעת יעדים, הערכת ביצועים, מעקב", "מעקב, קביעת יעדים, פיתוח תוכניות, הערכה", "קביעת יעדים במשותף, פיתוח תוכניות פעולה במשותף, מעקב התקדמות, הערכת ביצועים", "הערכת ביצועים, קביעת יעדים, מעקב, תוכניות", "קביעת יעדים, הערכת ביצועים, פיתוח תוכניות, מעקב"], "ans": 2, "exp": "Setting goals → Developing action plans → Reviewing progress → Appraise performance."}, {"topic": "תכנון", "kind": "ידע", "q": "מהם יתרונות ה־MBO לפי הסיכום?", "opts": ["שילוב מנהלים ועובדים ויצירת סינרגיה ומחויבות", "שיפור ביצועים בכל הרמות", "יצירת התאמה (Alignment) בין הדרגים", "הגברת המוטיבציה", "כל התשובות נכונות"], "ans": 4, "exp": "יתרונות MBO: סינרגיה, מחויבות, שיפור ביצועים, מוטיבציה והתאמה ארגונית."}, {"topic": "תכנון", "kind": "יישום", "q": "במוקד שירות נקבע יעד MBO שכל שיחה תסתיים תוך 6 דקות. הנציגים עומדים ביעד, אך מעבירים לקוחות הלאה בלי לפתור את בעייתם. איזה חיסרון של MBO מודגם כאן?", "opts": ["חוסר במחויבות של ההנהלה הבכירה", "עיגול פינות כדי לעמוד ביעדים כמותיים על חשבון האיכות", "עודף שיתוף עובדים", "חוסר ביעדים מדידים", "עלות גבוהה של תכנון תרחישים"], "ans": 1, "exp": "\"חוק 6 הדקות\" – עמידה פורמלית ביעד כמותי על חשבון הערך האמיתי; לכן נדרש שילוב מדדים כמותיים ואיכותניים."}, {"topic": "תכנון", "kind": "ידע", "q": "אילו חסרונות של MBO הוזכרו בקורס?", "opts": ["התהליך אינו משתף את העובדים", "אינו מאפשר מעקב", "אינו מתאים לדרג הביניים", "עלול ליצור תחרות לא בריאה ולעודד התנהגות לא אתית או התעלמות מבעיות כדי לעמוד ביעד", "אין לו חסרונות"], "ans": 3, "exp": "חסרונות: תחרות לא בריאה, חוסר הוגנות, התעלמות מבעיות והתנהגות לא אתית לשם עמידה ביעד."}, {"topic": "תכנון", "kind": "ידע", "q": "מה פירוש האות A במודל SMART?", "opts": ["Attainable & realistic – בר השגה וריאלי", "Accurate – מדויק", "Agile – גמיש", "Ambitious – שאפתני", "Accountable – בעל אחריותיות"], "ans": 0, "exp": "SMART: Specific, Measurable, Attainable & realistic, Relevant/Linked to rewards, Timely."}, {"topic": "תכנון", "kind": "ידע", "q": "מה פירוש האות R במודל SMART לפי הקורס?", "opts": ["Realistic – ריאלי", "Responsible – אחראי", "Relevant / Linked to rewards – רלוונטי ומקושר לתגמולים", "Rapid – מהיר", "Reviewed – נבדק"], "ans": 2, "exp": "R – רלוונטי למשימה ולתפקיד ומקושר לתגמול (לא בהכרח כספי)."}, {"topic": "תכנון", "kind": "יישום", "q": "מנהל קבע לצוות שלו את היעד \"להשתפר בשירות\". לפי SMART, מה הבעיה העיקרית ביעד?", "opts": ["הוא בר השגה מדי", "הוא אינו ספציפי, אינו מדיד ואינו תחום בזמן", "הוא מקושר מדי לתגמולים", "הוא רלוונטי מדי", "אין בו בעיה"], "ans": 1, "exp": "יעד טוב צריך להיות ספציפי, מדיד ותחום בזמן, למשל \"להעלות את ציון שביעות הרצון ל־90 עד סוף הרבעון\"."}, {"topic": "תכנון", "kind": "יישום", "q": "איזה מהיעדים הבאים עומד בצורה הטובה ביותר בעקרונות SMART?", "opts": ["\"להיות החברה הטובה בשוק\"", "\"להגדיל מכירות\"", "\"לשפר את המוטיבציה של העובדים\"", "\"להצליח יותר מהשנה שעברה\"", "\"להגדיל את מכירות קו המוצרים X ב־10% עד סוף רבעון 2, עם בונוס לצוות בעמידה ביעד\""], "ans": 4, "exp": "רק תשובה ה' ספציפית, מדידה, ריאלית, מקושרת לתגמול ותחומה בזמן."}, {"topic": "תכנון", "kind": "ידע", "q": "לפי הסיכום, מה עלול לקרות כאשר יעדים אינם עומדים בעקרונות SMART?", "opts": ["אין לכך השפעה", "עלייה בביצועים", "שיפור ביחסי עבודה", "שני מצבי קיצון: אבטלה סמויה (פוטנציאל לא ממומש), או סטרס ושחיקה מיעדים לא ריאליים", "התגברות התחרות הבריאה"], "ans": 3, "exp": "יעדים לא מתוכננים מובילים לאבטלה סמויה או לשחיקה, ויתור וניסיונות לעקוף את המערכת."}, {"topic": "תכנון", "kind": "ידע", "q": "מהו השלב הראשון במודל \"הפיכת תוכניות לאפקטיביות\" (Making Plans Work)?", "opts": ["קביעת יעדים (Set Goals)", "פיתוח מחויבות", "מעקב אחר התקדמות", "שמירה על גמישות", "עדכון התוכנית"], "ans": 0, "exp": "סדר המודל: קביעת יעדים → פיתוח מחויבות → תוכניות פעולה אפקטיביות → מעקב התקדמות → שמירה על גמישות → עדכון/התחלה מחדש."}, {"topic": "תכנון", "kind": "ידע", "q": "לפי המצגת, כיצד מפתחים מחויבות למטרות (Developing Commitment to Goals)?", "opts": ["קביעת מטרות בשיתוף עובדים ובעלי עניין", "בחירת מטרות סבירות", "הפיכת המטרות לפומביות", "השגת תמיכה מצד ההנהלה הבכירה", "כל התשובות נכונות"], "ans": 4, "exp": "ארבעת הכלים במצגת: שיתוף, מטרות סבירות, פרסום ברבים, ותמיכת ההנהלה הבכירה."}, {"topic": "תכנון", "kind": "ידע", "q": "אילו רכיבים כוללת תוכנית פעולה אפקטיבית (Effective Action Plan) לפי המצגת?", "opts": ["חזון, משימה וערכים", "צעדים ספציפיים, אנשים, משאבים ותקופת זמן", "חוזקות, חולשות, הזדמנויות ואיומים", "הפשרה, תנועה והקפאה", "תכנון, ארגון, הובלה ובקרה"], "ans": 1, "exp": "תוכנית אפקטיבית עונה על שאלות ה־WH: צעדים ספציפיים, אנשים, משאבים ולוח זמנים."}, {"topic": "תכנון", "kind": "ידע", "q": "לפי מחקרים שהוזכרו בכיתה, מה מהבאים הוא אחד הדברים השוחקים ביותר את העובדים?", "opts": ["שכר נמוך בלבד", "עבודה בצוות", "מנהלים שאינם תומכים בהם ואינם מהווים דוגמה אישית", "יעדים ברורים מדי", "ריבוי ישיבות"], "ans": 2, "exp": "אחד הדברים השוחקים ביותר: מנהלים שלא תומכים ולא מהווים דוגמה אישית, ללא יצירת ערך וקרבה."}, {"topic": "תכנון", "kind": "יישום", "q": "מנהלת רוצה לחזק את המחויבות של עובדיה בתקופה עמוסה ורוויית לחץ. מה מהבאים מתאים לכלים שהוצגו בקורס?", "opts": ["לחבר את העובדים למשמעות המשימה ולתרומתם למערכת", "להיות נוכחת בשטח ולתת דוגמה אישית", "ליצור ביטחון פסיכולוגי ולתת אוטונומיה ואחריות על פרויקטים", "להימנע מכל שיתוף בהחלטות כדי לא להעמיס", "תשובות א', ב' וג' נכונות"], "ans": 3, "exp": "כלים ליצירת מחויבות: משמעות, גאווה ושייכות, דוגמה אישית, ביטחון פסיכולוגי, ואוטונומיה המחזקת מסוגלות עצמית."}, {"topic": "תכנון", "kind": "ידע", "q": "ניתוח SWOT מחלק את הגורמים ל:", "opts": ["גורמים פנימיים (חוזקות וחולשות) וגורמים חיצוניים (הזדמנויות ואיומים)", "גורמים פנימיים (הזדמנויות ואיומים) וחיצוניים (חוזקות וחולשות)", "גורמים כספיים ולא כספיים", "גורמים לטווח קצר בלבד", "גורמים אנושיים וטכנולוגיים"], "ans": 0, "exp": "S ו־W פנימיים (כאן ועכשיו); O ו־T חיצוניים (סביבתי, \"פנים קדימה\")."}, {"topic": "תכנון", "kind": "ידע", "q": "לפי המצגת, כיצד יש להעריך חוזקות וחולשות בניתוח SWOT?", "opts": ["באופן מוחלט, ללא השוואה", "רק לפי דעת המנכ\"ל", "לפי נתוני העבר בלבד", "בהשוואה למתחרים/לאחרים", "לפי סקר עובדים בלבד"], "ans": 3, "exp": "חוזקות וחולשות נמדדות בהשוואה למתחרים."}, {"topic": "תכנון", "kind": "ידע", "q": "מה נכון לגבי ניתוח SWOT לפי המצגת?", "opts": ["זהו כלי מורכב הדורש חודשים של ניתוח כמותי", "זהו כלי קל לשימוש לסקירה מהירה של המצב האסטרטגי, המבוצע לרוב בסיעור מוחות ומהווה בסיס לניתוח מפורט יותר", "הוא מתייחס רק לסביבה הפנימית", "קל תמיד להבחין בין איומים לחולשות", "הוא מחליף את הצורך בתכנון תרחישים"], "ans": 1, "exp": "SWOT קל לשימוש, מבוצע בסיעור מוחות ומהווה בסיס לניתוח מעמיק. לעיתים קשה להבחין בין איומים לחולשות (למשל מפעילי סלולר)."}, {"topic": "תכנון", "kind": "ידע", "q": "בהצלבות של מטריצת SWOT, מהו הכיוון האסטרטגי של הצלבת חוזקות (S) עם הזדמנויות (O)?", "opts": ["Resist – להתנגד", "Forget – לשכוח/לזנוח", "Explore – לחקור", "Defend – להתגונן", "Exploit – לנצל / למנף (\"מכפיל כוח\")"], "ans": 4, "exp": "SO = Exploit, מנוף/מכפיל כוח."}, {"topic": "תכנון", "kind": "ידע", "q": "הצלבה של חולשות (W) עם איומים (T) מובילה לאסטרטגיה:", "opts": ["Exploit", "Resist", "Forget – בריחה מהירה מהתחום (\"בטן רכה\")", "Explore", "Expand"], "ans": 2, "exp": "WT = Forget – יציאה מהירה מתחום שבו הארגון חלש והשוק מאיים."}, {"topic": "תכנון", "kind": "ידע", "q": "הצלבה של חוזקות (S) עם איומים (T) מובילה לאסטרטגיה:", "opts": ["Resist – להתנגד לאיום מתוך עוצמה קיימת", "Exploit", "Forget", "Explore", "Retreat"], "ans": 0, "exp": "ST = Resist – שימוש בחוזקות כדי להתמודד עם איומים."}, {"topic": "תכנון", "kind": "ידע", "q": "הצלבה של חולשות (W) עם הזדמנויות (O) מובילה לאסטרטגיה:", "opts": ["Exploit", "Resist", "Forget", "Explore – חיפוש הזדמנויות כדי לטפל בחולשות", "Defend"], "ans": 3, "exp": "WO = Explore – ניצול הזדמנויות כדי להתגבר על חולשות."}, {"topic": "תכנון", "kind": "יישום", "q": "בזמן הקורונה ניצלה תנובה את קווי הייצור ומערך ההפצה החזקים שלה כדי להשיק את \"תנובה עד הבית\" ולהגיע ישירות לבית הלקוח. זוהי דוגמה לאסטרטגיית:", "opts": ["Resist", "Exploit (חוזקה + הזדמנות)", "Forget", "Explore", "WT"], "ans": 1, "exp": "חוזקה (מותג, ייצור והפצה) + הזדמנות (שינוי הרגלי צריכה) = מכפיל כוח."}, {"topic": "תכנון", "kind": "יישום", "q": "אל על, שמותגה חזק, התמודדה עם מדיניות \"שמיים פתוחים\" ותחרות חברות הלואו־קוסט באמצעות הקמת מותג UP עם מחירים מוזלים. זוהי דוגמה ל:", "opts": ["Exploit", "Forget", "Explore", "WO", "Resist (חוזקה + איום)"], "ans": 4, "exp": "אל על השתמשה בחוזקת המותג כדי לבלום איום חיצוני – Resist."}, {"topic": "תכנון", "kind": "יישום", "q": "ביטוח ישיר, שהייתה חלשה בתחום ביטוחי המנהלים והפנסיה בשוק מאיים, מכרה את הפעילות למנורה מבטחים והתמקדה בליבה. זוהי דוגמה ל:", "opts": ["Exploit", "Resist", "Forget (חולשה + איום)", "Explore", "SO"], "ans": 2, "exp": "יציאה מהירה מתחום חלש ומאוים כדי להפסיק להפסיד כסף."}, {"topic": "תכנון", "kind": "יישום", "q": "רמי לוי, שהייתה חלשה בתחום הדיגיטל, השקיעה מיליונים במכירות אונליין כדי לנצל את מגמת הקנייה המקוונת. זוהי דוגמה ל:", "opts": ["Forget", "Resist", "Exploit", "Explore (חולשה + הזדמנות)", "ST"], "ans": 3, "exp": "הפיכת חולשה להזדמנות – Explore."}, {"topic": "תכנון", "kind": "יישום", "q": "רשת מזון מהיר שחולשתה הייתה אוכל לא בריא ניצלה את מגמת הבריאות והוסיפה סלטים ותפריט בריא יותר. לאיזה רבע במטריצה מתאימה הפעולה?", "opts": ["WO – Explore", "SO – Exploit", "ST – Resist", "WT – Forget", "אף אחת מהתשובות אינה נכונה"], "ans": 0, "exp": "דוגמת מקדונלדס: חולשה (אוכל לא בריא) + הזדמנות (מגמת בריאות) = Explore."}, {"topic": "תכנון", "kind": "ידע", "q": "כיצד משתמשות חברות בכלי ה־SWOT המתקדם לפי הסיכום?", "opts": ["ממפות רק את החוזקות", "ממפות את ארבעת הרכיבים, מבצעות את ארבע ההצלבות ומחליטות לפחות על צעד אסטרטגי אחד בכל רבע", "מבצעות רק את הצלבת SO", "משתמשות בו רק לאחר משבר", "מעבירות את הניתוח ליועץ חיצוני בלבד"], "ans": 1, "exp" <script>
(function(){
const QS = JSON.parse(document.getElementById('data').textContent);
QS.forEach((q,i)=>q.id=i+1);
const L = ['א','ב','ג','ד','ה'];
const TOPICS = [...new Set(QS.map(q=>q.topic))];
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let st = {mode:'practice', topic:'', kind:'', shown:40};
let answers = store.get('mgmt-answers', {});   // id -> chosen index (practice)
let exam = null; // {ids:[], picks:{}, done:false}

const $ = s=>document.querySelector(s);
const esc = s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderStats(){
  const done = Object.keys(answers).length;
  const right = Object.entries(answers).filter(([id,a])=>QS[id-1].ans===a).length;
  const k = QS.filter(q=>q.kind==='ידע').length;
  $('#stats').innerHTML = `<span><b>${QS.length}</b> שאלות</span><span><b>${k}</b> ידע · <b>${QS.length-k}</b> יישומיות</span>`+
   `<span>ענית בתרגול: <b>${done}</b>${done?` · נכונות: <b>${right}</b> (${Math.round(right/done*100)}%)`:''}</span>`+
   (done?` <button class="chip" id="reset">איפוס התרגול</button>`:'');
  const r=$('#reset'); if(r) r.onclick=()=>{answers={};store.set('mgmt-answers',answers);render()};
}
function renderTopics(){
  const box=$('#topics');
  const cnt=t=>QS.filter(q=>(!t||q.topic===t)&&(!st.kind||q.kind===st.kind)).length;
  box.innerHTML='<span class="lbl">נושא</span>'+[''].concat(TOPICS).map(t=>
    `<button class="chip" data-topic="${esc(t)}" aria-pressed="${st.topic===t}">${t||'כל הנושאים'}<span class="n">${cnt(t)}</span></button>`).join('');
  box.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{st.topic=b.dataset.topic;st.shown=40;if(st.mode==='exam')exam=null;render()});
  document.querySelectorAll('#kinds .chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.kind===st.kind));
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===st.mode));
}
function pool(){return QS.filter(q=>(!st.topic||q.topic===st.topic)&&(!st.kind||q.kind===st.kind))}

function card(q, n, state){
  // state: {pick, reveal, locked}
  const opts=q.opts.map((o,i)=>{
    let cls='opt';
    if(state.reveal){ if(i===q.ans) cls+=' right'; else if(i===state.pick) cls+=' wrong'; }
    else if(i===state.pick) cls+=' sel';
    return `<li><button class="${cls}" data-q="${q.id}" data-i="${i}" ${state.locked?'disabled':''}><span class="bub">${L[i]}</span><span>${esc(o)}</span></button></li>`;
  }).join('');
  let exp='';
  if(state.reveal){
    const v = state.pick==null?'':(state.pick===q.ans?'<span class="verdict ok">נכון. </span>':`<span class="verdict no">לא נכון – התשובה היא ${L[q.ans]}'. </span>`);
    exp=`<div class="exp">${v}<b>תשובה ${L[q.ans]}'.</b> ${esc(q.exp)}</div>`;
  }
  return `<article class="q"><div class="qhead"><span class="num">${n}.</span><span class="tag">${esc(q.topic)}</span><span class="tag ${q.kind==='יישום'?'app':''}">${q.kind==='יישום'?'שאלה יישומית':'שאלת ידע'}</span><span>#${q.id}</span></div>`+
    `<p class="qt">${esc(q.q)}</p><ol class="opts">${opts}</ol>${exp}</article>`;
}

function render(){
  renderStats(); renderTopics();
  const list=$('#list'), top=$('#top'), more=$('#more'); more.innerHTML=''; top.innerHTML='';
  const P=pool();
  if(!P.length){list.innerHTML='<p class="empty">אין שאלות שמתאימות לסינון הזה.</p>';return}
  if(st.mode==='practice'){
    $('#modeNote').textContent='בחרי תשובה כדי לראות אם צדקת ואת ההסבר';
    const shown=P.slice(0,st.shown);
    list.innerHTML=shown.map((q,i)=>{const a=answers[q.id];return card(q,i+1,{pick:a,reveal:a!=null,locked:a!=null})}).join('');
    list.querySelectorAll('.opt:not([disabled])').forEach(b=>b.onclick=()=>{answers[b.dataset.q]=+b.dataset.i;store.set('mgmt-answers',answers);
      const q=QS[b.dataset.q-1]; const art=b.closest('.q'); const n=art.querySelector('.num').textContent.replace('.','');
      art.outerHTML=card(q,n,{pick:+b.dataset.i,reveal:true,locked:true}); renderStats();
      document.querySelectorAll(`.opt[data-q="${q.id}"]`).forEach(x=>x.disabled=true);});
    if(P.length>st.shown){more.innerHTML=`<button class="act ghost" id="mbtn">הצגת עוד ${Math.min(40,P.length-st.shown)} שאלות (מוצגות ${st.shown} מתוך ${P.length})</button>`;$('#mbtn').onclick=()=>{st.shown+=40;render()}}
  } else if(st.mode==='bank'){
    $('#modeNote').textContent='כל השאלות עם התשובה הנכונה וההסבר';
    list.innerHTML=P.map((q,i)=>card(q,i+1,{pick:null,reveal:true,locked:true})).join('');
  } else {
    $('#modeNote').textContent='20 שאלות אקראיות · 5 נקודות לשאלה, כמו במבחן';
    if(!exam){const ids=P.map(q=>q.id).sort(()=>Math.random()-.5).slice(0,20);exam={ids,picks:{},done:false}}
    const qs=exam.ids.map(id=>QS[id-1]);
    const answered=Object.keys(exam.picks).length;
    if(exam.done){
      const right=qs.filter(q=>exam.picks[q.id]===q.ans).length;
      top.innerHTML=`<div class="score" style="margin-top:18px"><div><div class="big">${right*5}</div><div class="note">מתוך ${qs.length*5} נקודות</div></div><div>${right} נכונות מתוך ${qs.length}</div><button class="act" id="again">מבחן חדש</button></div>`;
      $('#again').onclick=()=>{exam=null;render();window.scrollTo(0,0)};
    } else {
      top.innerHTML=`<div class="score" style="margin-top:18px"><div>ענית על <b>${answered}</b> מתוך ${qs.length}</div><button class="act" id="submit">הגשה ובדיקה</button><button class="act ghost" id="newex">החלפת שאלות</button></div>`;
      $('#submit').onclick=()=>{exam.done=true;render();window.scrollTo(0,0)};
      $('#newex').onclick=()=>{exam=null;render()};
    }
    list.innerHTML=qs.map((q,i)=>card(q,i+1,{pick:exam.picks[q.id],reveal:exam.done,locked:exam.done})).join('');
    if(!exam.done) list.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{exam.picks[b.dataset.q]=+b.dataset.i;
      b.closest('.opts').querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));
      const s=top.querySelector('b'); if(s) s.textContent=Object.keys(exam.picks).length;});
  }
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{st.mode=b.dataset.mode;st.shown=40;render()});
document.querySelectorAll('#kinds .chip').forEach(b=>b.onclick=()=>{st.kind=b.dataset.kind;st.shown=40;if(st.mode==='exam')exam=null;render()});
render();
})();
</script>

</body>
</html>
