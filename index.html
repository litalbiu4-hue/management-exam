<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מאגר שאלות – שיטות וכלי ניהול מתקדמים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: one reading column like an exam booklet; sticky control strip; answer-sheet bubbles א–ה per question */
:root{
  --paper:#f6f7fa; --sheet:#ffffff; --ink:#1b2333; --muted:#5b6475; --line:#dde1ea;
  --accent:#2c46a0; --accent-soft:#e7ebf8; --ok:#1d7a4c; --ok-soft:#e3f3ea; --bad:#b3342b; --bad-soft:#f8e5e3;
  --chip:#eef0f5;
  --f-display:"Frank Ruhl Libre","David","Times New Roman",serif;
  --f-body:"Assistant","Arial Hebrew","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12161f; --sheet:#1a202c; --ink:#e7eaf1; --muted:#a2aabb; --line:#2c3445;
  --accent:#8ea3f0; --accent-soft:#25304f; --ok:#5fcf95; --ok-soft:#183427; --bad:#f08a80; --bad-soft:#3a1f1d; --chip:#232a38; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161f; --sheet:#1a202c; --ink:#e7eaf1; --muted:#a2aabb; --line:#2c3445;
  --accent:#8ea3f0; --accent-soft:#25304f; --ok:#5fcf95; --ok-soft:#183427; --bad:#f08a80; --bad-soft:#3a1f1d; --chip:#232a38; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;direction:rtl}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:28px 64px}
header h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,4vw,2.3rem);line-height:1.2;margin:0;text-wrap:balance}
header p{margin:.4rem 0 0;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:.95rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:12px;margin-top:18px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lbl{font-size:.8rem;color:var(--muted);letter-spacing:.04em;margin-inline-end:4px}
button{font:inherit;cursor:pointer;color:inherit}
.tab,.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:4px 12px;font-size:.92rem}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip .n{font-variant-numeric:tabular-nums;opacity:.7;margin-inline-start:4px;font-size:.8rem}
.tab:focus-visible,.chip:focus-visible,.opt:focus-visible,.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.act{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:6px 14px;font-weight:600}
:root[data-theme="dark"] .act{color:#10162a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .act{color:#10162a}}
.act.ghost{background:transparent;color:var(--accent)}
.note{font-size:.9rem;color:var(--muted)}
#list{display:grid;gap:14px;margin-top:18px}
.q{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.qhead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.8rem;color:var(--muted);margin-bottom:6px}
.num{font-family:var(--f-display);font-weight:700;color:var(--ink);font-size:1rem;font-variant-numeric:tabular-nums}
.tag{background:var(--chip);border-radius:4px;padding:1px 7px}
.tag.app{background:var(--accent-soft);color:var(--accent)}
.qt{font-weight:700;font-size:1.05rem;margin:0 0 10px;text-wrap:pretty}
.opts{display:grid;gap:6px;list-style:none;margin:0;padding:0}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 8px}
.opt:hover{background:var(--chip)}
.bub{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-weight:700;font-size:.85rem;line-height:1;margin-top:1px}
.opt.sel .bub{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt[disabled]{cursor:default}
.opt[disabled]:hover{background:inherit}
.opt.right[disabled]:hover{background:var(--ok-soft)} .opt.wrong[disabled]:hover{background:var(--bad-soft)}
.exp{margin-top:10px;padding:10px 12px;border-inline-start:3px solid var(--accent);background:var(--accent-soft);border-radius:4px;font-size:.95rem}
.exp b{color:var(--accent)}
.verdict{font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.score{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.score .big{font-family:var(--f-display);font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.more{display:flex;justify-content:center;margin-top:18px}
.round{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-top:18px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;font-variant-numeric:tabular-nums}
.round .big{font-family:var(--f-display);font-size:1.9rem;font-weight:700;line-height:1}
.round .grow{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.bar{height:6px;border-radius:3px;background:var(--chip);flex-basis:100%;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.chip small{font-size:.75rem;color:var(--muted);margin-inline-start:4px}
.breakdown{flex-basis:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px 16px;font-size:.88rem;color:var(--muted)}
.breakdown b{color:var(--ink)}
@media (max-width:640px){body{font-size:16px}.q{padding:14px}.controls{position:static}}
@media (prefers-reduced-motion:no-preference){.opt{transition:background .12s}}

.sitenav{display:flex;gap:16px;margin-bottom:16px}.sitenav a{color:var(--accent);font-weight:600}</style>
</head>

action: זיהוי סטיות → ניתוח → פיתוח ויישום תוכניות לסגירת הפער."}, {"topic": "בקרה", "kind": "ידע", "q": "לפי הקורס, מהי הבקרה ה\"אמיתית\"?", "opts": ["בקרה גלויה, שבה העובדים יודעים מראש מתי יבדקו אותם", "בקרה בירוקרטית, המבוססת על שעוני נוכחות וטפסים", "בקרה תקציבית, המשווה בין הוצאות מתוכננות לבפועל", "בקרה סמויה", "בקרה שנתית, המסכמת את כל ביצועי השנה"], "ans": 3, "exp": "\"יש בקרה סמויה וגלויה, והבקרה הסמויה היא הבקרה האמיתית\" (למשל מבקר סמוי במלונות או ניתוח שיחות במוקד)."}, {"topic": "בקרה", "kind": "ידע", "q": "מהי בקרת משוב (Feedback control)?", "opts": ["מידע על ליקויים לאחר שהתרחשו", "איסוף מידע על ליקויים תוך כדי שהם מתרחשים", "ניטור של התשומות עוד לפני תחילת הביצוע", "בקרה על ספקים לפני שהם מספקים חומרי גלם", "בקרה שהעובד מבצע על עצמו בעזרת דשבורד"], "ans": 0, "exp": "Feedback – לאחר מעשה."}, {"topic": "בקרה", "kind": "ידע", "q": "מהי בקרה מקבילה (Concurrent control)?", "opts": ["איסוף מידע על ליקויים לאחר שהתרחשו", "ניטור התשומות לפני הביצוע כדי למנוע ליקויים", "מידע על ליקויים בזמן אמת", "בקרה שמבצעים העמיתים בצוות זה על זה", "בקרה על התקציב השנתי בסוף כל רבעון"], "ans": 2, "exp": "Concurrent – בזמן אמת, תוך כדי התרחשות."}, {"topic": "בקרה", "kind": "ידע", "q": "מהי בקרת הזנה מראש (Feedforward control)?", "opts": ["איסוף מידע על ליקויים לאחר שהתרחשו", "איסוף מידע על ליקויים בזמן אמת", "השוואת הוצאות מתוכננות להוצאות בפועל", "הערכת ביצועים שנתית של כל עובד ועובד", "ניטור תשומות כדי למנוע ליקויים מראש"], "ans": 4, "exp": "Feedforward – בקרה מקדימה ומונעת: מנטרים תשומות ולא תפוקות."}, {"topic": "בקרה", "kind": "יישום", "q": "בצבא ארה\"ב, מפקד טייסת, סגנו וכל הטייסת מקיימים תחקיר (Debriefing) לאחר כל משימה. באיזה סוג בקרה מדובר?", "opts": ["בקרה מקדימה (Feedforward)", "בקרת משוב (Feedback)", "בקרה מקבילה (Concurrent)", "בקרה בירוקרטית (Bureaucratic)", "בקרה קונסרטיבית (Concertive)"], "ans": 1, "exp": "תחקיר הוא בקרת פידבק על תקופה שכבר עברה."}, {"topic": "בקרה", "kind": "ידע", "q": "מהם יתרונות התחקיר (בקרת משוב) לפי הדוגמה מהשיעור?", "opts": ["מונע את ה ה וקלה ליישום, אך אינה מונעת תקלות", "אינה מעוררת התנגדות אצל הספקים, אך איטית", "מאפשרת תגובה בזמן אמת, אך שוחקת את העובדים", "חוסכת תקלות, אך יקרה ומעוררת אנטגוניזם", "אין לה חסרונות, ולכן כל הארגונים משתמשים בה"], "ans": 3, "exp": "בקרה מקדימה חוסכת בהמשך תקלות וכסף, אך דורשת משאבים רבים ועלולה להרגיז את הספקים."}, {"topic": "בקרה", "kind": "יישום", "q": "מנכ\"ל תדיראן מקבל בכל רגע נתוני מכירות בזמן אמת בדשבורד ומגיב לפני שהתקלה הופכת למשבר. באיזו בקרה מדובר?", "opts": ["בקרת משוב (Feedback)", "בקרה בירוקרטית (Bureaucratic)", "בקרה מקבילה (Concurrent)", "בקרה נורמטיבית (Normative)", "בקרה מקדימה (Feedforward)"], "ans": 2, "exp": "בקרה בזמן אמת – Concurrent."}, {"topic": "בקרה", "kind": "ידע", "q": "מהם חסרונות הבקרה המקבילה (בזמן אמת) לפי הסיכום?", "opts": ["סטרס, עלות גבוהה, ואינה מתאימה לכל ארגון", "היא איטית מדי ומגיעה רק בסוף הרבעון", "היא מגיעה רק לאחר מעשה, כשכבר מאוחר", "אינה מאפשרת תגובה מהירה לתקלות בשטח", "כל התשובות נכונות"], "ans": 0, "exp": "הבקרה בזמן אמת חשובה, אבל יוצרת לחץ (\"מנהלים את המדדים במקום את העבודה\"), יקרה ולא מתאימה לכל דבר (למשל לשירות)."}, {"topic": "בקרה", "kind": "יישום", "q": "במוקד שירות נקבעו שני מדדים: \"מספר שיחות מקסימלי לשעה\" ו\"פתרון מלא של בעיית הלקוח\". הנציגים מתקשים לעמוד בשניהם. לפי הקורס, הבעיה היא:", "opts": ["מחסור בבקרה בירוקרטית, כמו שעוני נוכחות", "עודף בקרה עצמית, שמבלבלת את הנציגים", "מבנה מטריציוני, שבו לכל נציג שני מנהלים", "היעדר בקרה מקדימה על איכות הלקוחות", "מדדים מתנגשים – כמות מול איכות"], "ans": 4, "exp": "צריך לוודא שאין התנגשות בין מדדים, בעיקר בין כמות לאיכות, ולהתאים אותם."}, {"topic": "בקרה", "kind": "ידע", "q": "מהו Benchmarking בהקשר הבקרה לפי הסיכום?", "opts": ["דירוג העובדים כדי לזהות ולפטר את החלשים ביותר", "השוואה שיוצרת תחרות פנימית ובקרה", "בקרה מקדימה על ספקים לפני חתימת חוזה", "מערכת תגמולים קבועה, שאינה תלויה בביצועים", "סוג של תחקיר המתבצע לאחר כל משימה"], "ans": 1, "exp": "Benchmarking: השוואה ליצירת תחרות ובקרה. מאפיין גם את תרבות השוק."}, {"topic": "בקרה", "kind": "ידע", "q": "לפי המצגת, אילו סוגי מלאי קיימים בארגונים?", "opts": ["מלאי קבוע ומלאי משתנה, לפי קצב המכירות", "מלאי פנימי ומלאי חיצוני, לפי מקום האחסון", "מלאי ביטחון בלבד, לשעת חירום", "מוצרים מוגמרים, מלאי בתהליך וחומרי גלם", "תשובות א' וד' נכונות"], "ans": 3, "exp": "שלושת סוגי המלאי: Finished goods, Work in process, Raw material."}, {"topic": "בקרה", "kind": "יישום", "q": "במפעל רכב חונות מכוניות חדשות במגרש האחסון וממתינות למכירה. מה נכון לגבי מלאי זה?", "opts": ["מוצרים מוגמרים – הסוג היקר ביותר", "חומרי גלם – הסוג הזול ביותר", "מלאי בתהליך – בין שלבי הייצור", "מלאי ללא עלות – כבר שולם עליו", "מלאי ביטחון – לשעת מחסור"], "ans": 0, "exp": "מוצרים מוגמרים הם היקרים ביותר: הושקעו בהם עבודה ועלויות, ויש גם עלות אחסון. חומרי גלם (פלדה, צבע) הם הזולים ביותר."}, {"topic": "בקרה", "kind": "יישום", "q": "מנועים ולוחות מחוונים הממתינים להתקנה בפס הייצור של מפעל רכב הם דוגמה ל:", "opts": ["מוצרים מוגמרים (Finished goods)", "חומרי גלם (Raw material)", "מלאי בתהליך (Work in process)", "מלאי ביטחון (Safety stock)", "מלאי עודף (Excess stock)"], "ans": 2, "exp": "מלאי בתהליך: חומרים שנעים בין שלבי הייצור ואינם מוצרים מוגמרים."}, {"topic": "בקרה", "kind": "ידע", "q": "מהי בקרה תקציבית (Budgetary Control)?", "opts": ["אחת השיטות הנפוצות ביותר לבקרה ניהולית", "קביעת יעדי הוצאות, ניטור והשוואה לתקציב ושינוי במידת הצורך", "דוחות של הוצאות מתוכננות מול בפועל (מזומן, נכסים, משכורות)", "שיטה שכבר אינה בשימוש בארגונים מודרניים", "תשובות א', ב' וג' נכונות"], "ans": 4, "exp": "כל אלה מתארים בקרה תקציבית לפי המצגת."}, {"topic": "בקרה", "kind": "ידע", "q": "מה מהבאים הוא מאפיין של מערכת בקרה אפקטיבית לפי המצגת?", "opts": ["ריבוי בקרות על כל פעילות, גם הפחות חשובות, כדי לא לפספס", "דיווח מהיר על סטיות, ועדיף לפני שהן קורות", "מידע שמובן רק למנהלים הבכירים, ולא לעובדים בשטח", "מידע שמושפע גם מגורמים שאינם קשורים למטרת הבקרה", "העברת כל המידע לכל העובדים, ללא קשר לתחום האחריות שלהם"], "ans": 1, "exp": "מאפיינים: מובנות, אחריות מוגדרת, מהירות וזיהוי מוקדם, מיקוד בפעילויות קריטיות, אובייקטיביות ועקביות."}, {"topic": "בקרה", "kind": "יישום", "q": "מערכת בקרה בחברה מודדת עשרות פרמטרים זניחים, כמו מספר העטים שנצרכו, ומבזבזת זמן רב. איזה עיקרון של בקרה אפקטיבית מופר?", "opts": ["מובנות – המידע אינו מובן למי שפועל לפיו", "אובייקטיביות – המידע מושפע מגורמים זרים", "עקביות – הבקרה אינה תואמת את מטרת הפעילות", "מיקוד בפעילויות קריטיות", "מהירות – הסטיות מדווחות באיחור"], "ans": 3, "exp": "המערכת צריכה למשוך תשומת לב לפעילויות הקריטיות; ריבוי בקרות על זוטות אינו כלכלי."}, {"topic": "בקרה", "kind": "ידע", "q": "מהי בקרה בירוקרטית (Bureaucratic Control)?", "opts": ["בקרה מלמעלה למטה, בחוקים, תגמולים ועונשים", "בקרה המבוססת על הערכים והאמונות של הקבוצה", "בקרה שבה כל עובד מבקר את עצמו בתוך גבולות", "בקרה המבוססת על נורמות וגיוס קפדני של עובדים", "בקרה בזמן אמת באמצעות דשבורדים ממוחשבים"], "ans": 0, "exp": "בקרה בירוקרטית: Top-down, חוקים, נהלים, תגמולים ועונשים. לרוב אינה יעילה, ויש בה התנגדות גבוהה לשינוי."}, {"topic": "בקרה", "kind": "יישום", "q": "באילו ארגונים הבקרה הבירוקרטית (שעוני נוכחות, טפסים, נוכחות פיזית) עדיין חיונית לפי הסיכום?", "opts": ["בחברות הייטק, שבהן חשוב לדעת מתי כל עובד מחובר", "בייצור, בתעשייה ובתחנות דלק", "בסטארט־אפים, שבהם יש מעט נהלים כתובים", "בארגונים וירטואליים, שבהם אין משרד פיזי", "תשובות ב' וד' נכונות"], "ans": 1, "exp": "נחשבת מיושנת בהייטק, אבל חיונית בענפים שבהם נוכחות פיזית קריטית לתפעול."}, {"topic": "בקרה", "kind": "ידע", "q": "מהי בקרה אובייקטיבית (Objective Control)?", "opts": ["בקרה על בסיס הערכים והנורמות של הארגון", "בקרה שמבצעת הקבוצה על חבריה", "בקרה שבה העובד מנטר את עצמו בלבד", "בקרה סמויה בלבד, ללא ידיעת העובדים", "מדדים נצפים: בקרת התנהגות ובקרת תפוקה"], "ans": 4, "exp": "Objective Control = Behavior control + Output control."}, {"topic": "בקרה", "kind": "יישום", "q": "מנהלת מוקד בודקת גם אם הנציג אדיב ללקוחות ועונה בזמן, וגם כמה עסקאות סגר בפועל. איזו בקרה היא מפעילה?", "opts": ["בקרה בירוקרטית (Bureaucratic)", "בקרה נורמטיבית (Normative)", "בקרה אובייקטיבית (Objective)", "בקרה קונסרטיבית (Concertive)", "בקרת משוב (Feedback)"], "ans": 2, "exp": "השילוב של \"מה עשה\" (תפוקה) ו\"איך עשה\" (התנהגות) נותן תמונה מאוזנת לכל עובד."}, {"topic": "בקרה", "kind": "ידע", "q": "מהי בקרה נורמטיבית (Normative Control)?", "opts": ["בקרה באמצעות שעוני נוכחות וטפסים פורמליים", "בקרה באמצעות דשבורד אישי של כל עובד", "בקרה שמפעיל צוות אוטונומי על חבריו", "נורמות וערכים, גיוס קפדני ולמידה מוותיקים", "כל התשובות נכונות"], "ans": 3, "exp": "ככל שיש יותר נורמות מוטמעות, נדרשים פחות כללים נוקשים."}, {"topic": "בקרה", "kind": "יישום", "q": "בחברה עם ערכי שירות חזקים, עובדים חדשים לומדים מהוותיקים \"איך עושים דברים אצלנו\", והמנהלים כמעט אינם נדרשים לנהלים כתובים. איזו בקרה פועלת כאן?", "opts": ["בקרה נורמטיבית (Normative)", "בקרה בירוקרטית (Bureaucratic)", "בקרת תפוקה (Output)", "בקרה מקבילה (Concurrent)", "בקרה תקציבית (Budgetary)"], "ans": 0, "exp": "הנורמות מעצבות את ה־DNA של הארגון ומווסתות התנהגות ללא פיקוד."}, {"topic": "בקרה", "kind": "ידע", "q": "מהי בקרה קונסרטיבית / קבוצתית (Concertive Control)?", "opts": ["בקרה שמפעיל המנכ\"ל על כל הצוותים בארגון", "ויסות ההתנהגות דרך ערכי קבוצת העבודה", "בקרה באמצעות חוקים ונהלים כתובים ומפורטים", "בקרה על ספקים לפני תחילת הייצור", "בקרה על רמות המלאי בכל שלבי הייצור"], "ans": 1, "exp": "צוותים אוטונומיים, שבהם החברים מפקחים יחד על התהליכים, התפוקה וההתנהגויות."}, {"topic": "בקרה", "kind": "ידע", "q": "מה החיסרון המרכזי של הבקרה הקבוצתית (קונסרטיבית)?", "opts": ["אינה נותנת למנהלים תמונה על מצב הצוות", "מחייבת שימוש בשעוני נוכחות ובטפסים", "לא רואים את הפרט – טרמפיסטים ופגיעה במצטיינים", "היא היקרה ביותר מבין סוגי הבקרה", "אינה מאפשרת להעביר עובדים בין קבוצות"], "ans": 2, "exp": "מדידת הצוות מסתירה את הפרט ועלולה לעודד בטלנות חברתית."}, {"topic": "בקרה", "kind": "ידע", "q": "מהי בקרה עצמית (Self Control)?", "opts": ["עובדים מפקחים על התנהגותם בתוך גבולות מוגדרים היטב", "עובדים קובעים יעדים ומנטרים את התקדמותם", "מנהלים מלמדים את העובדים את המיומנויות הנדרשות", "במהותה – ניהול עצמי", "כל התשובות נכונות"], "ans": 4, "exp": "בקרה עצמית מתאימה לארגונים שטוחים; כל עובד עם \"דשב   const cnt=t=>QS.filter(q=>(!t||q.topic===t)&&(!st.kind||q.kind===st.kind)).length;
  $('#topics').innerHTML='<span class="lbl">נושא</span>'+[''].concat(TOPICS).map(t=>
    `<button class="chip" data-topic="${esc(t)}" aria-pressed="${st.topic===t}">${t||'כל הנושאים'}<span class="n">${cnt(t)}</span></button>`).join('');
  $('#topics').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{st.topic=b.dataset.topic;st.shown=40;if(st.mode==='exam')exam=null;render()});
  document.querySelectorAll('#kinds .chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.kind===st.kind));
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===st.mode));
  const ex=$('#exams');
  ex.innerHTML='<span class="lbl">מבחן</span>'+EXAMS.map((e,i)=>{
    const s=scores['sim'+(i+1)];
    return `<button class="chip" data-exam="${i+1}" aria-pressed="${st.exam===i+1}">סימולציה ${i+1}${s!=null?`<small>אחרון: ${s}</small>`:''}</button>`}).join('')+
    `<button class="chip" data-exam="0" aria-pressed="${st.exam===0}">מבחן אקראי (לפי סינון)</button>`;
  ex.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{st.exam=+b.dataset.exam;exam=null;render();window.scrollTo(0,0)});
}

function card(q, n, state){
  const opts=q.opts.map((o,i)=>{
    let cls='opt';
    if(state.reveal){ if(i===q.ans) cls+=' right'; else if(i===state.pick) cls+=' wrong'; }
    else if(i===state.pick) cls+=' sel';
    return `<li><button class="${cls}" data-q="${q.id}" data-i="${i}" ${state.locked?'disabled':''}><span class="bub">${L[i]}</span><span>${esc(o)}</span></button></li>`;
  }).join('');
  let exp='';
  if(state.reveal){
    const v = state.pick==null?'<span class="verdict no">לא נענתה. </span>':(state.pick===q.ans?'<span class="verdict ok">נכון. </span>':`<span class="verdict no">לא נכון – התשובה היא ${L[q.ans]}'. </span>`);
    exp=`<div class="exp">${state.bank?'':v}<b>תשובה ${L[q.ans]}'.</b> ${esc(q.exp)}</div>`;
  }
  return `<article class="q" data-card="${q.id}"><div class="qhead"><span class="num">${n}.</span><span class="tag">${esc(q.topic)}</span><span class="tag ${q.kind==='יישום'?'app':''}">${q.kind==='יישום'?'שאלה יישומית':'שאלת ידע'}</span><span>#${q.id}</span></div>`+
    `<p class="qt">${esc(q.q)}</p><ol class="opts">${opts}</ol>${exp}</article>`;
}

function roundBar(P){
  const done=P.filter(q=>answers[q.id]!=null), right=done.filter(q=>answers[q.id]===q.ans).length;
  const label = (st.topic||'כל הנושאים')+(st.kind?` · ${st.kind==='ידע'?'שאלות ידע':'שאלות יישומיות'}`:'');
  const finished = done.length===P.length && P.length>0;
  return `<div class="round"><div><div class="big">${done.length?pct(right,done.length):'–'}</div><div class="note">ציון הסבב</div></div>`+
    `<div>${finished?'<b>הסבב הושלם!</b><br>':''}סבב: <b>${esc(label)}</b><br>ענית על <b>${done.length}</b> מתוך ${P.length} · נכונות: <b>${right}</b> · שגויות: <b>${done.length-right}</b></div>`+
    `<div class="grow"><button class="act ghost" id="wrongOnly">${st.wrongOnly?'הצגת כל השאלות':'רק השאלות ששגיתי בהן'}</button><button class="act" id="newRound">סבב חדש</button></div>`+
    `<div class="bar"><i style="width:${pct(done.length,P.length)}%"></i></div></div>`;
}

function render(){
  renderStats(); renderControls();
  const list=$('#list'), top=$('#top'), more=$('#more'); more.innerHTML=''; top.innerHTML='';
  if(st.mode==='practice'){
    const P=pool();
    $('#modeNote').textContent='בוחרים תשובה ורואים מיד אם צדקת. הציון מחושב לכל סבב (נושא וסוג שבחרת).';
    if(!P.length){list.innerHTML='<p class="empty">אין שאלות שמתאימות לסינון הזה.</p>';return}
    top.innerHTML=roundBar(P);
    $('#newRound').onclick=()=>{P.forEach(q=>delete answers[q.id]);store.set(AK,answers);st.wrongOnly=false;render()};
    $('#wrongOnly').onclick=()=>{st.wrongOnly=!st.wrongOnly;st.shown=40;render()};
    const V = st.wrongOnly? P.filter(q=>answers[q.id]!=null&&answers[q.id]!==q.ans) : P;
    if(st.wrongOnly && !V.length){list.innerHTML='<p class="empty">אין שאלות שגויות בסבב הזה.</p>';return}
    list.innerHTML=V.slice(0,st.shown).map((q,i)=>{const a=answers[q.id];return card(q,i+1,{pick:a,reveal:a!=null,locked:a!=null})}).join('');
    list.onclick=e=>{const b=e.target.closest('.opt:not([disabled])');if(!b)return;
      const id=+b.dataset.q; answers[id]=+b.dataset.i; store.set(AK,answers);
      const art=b.closest('.q'); const n=art.querySelector('.num').textContent.replace('.','');
      art.outerHTML=card(QS[id-1],n,{pick:answers[id],reveal:true,locked:true});
      top.innerHTML=roundBar(P);
      $('#newRound').onclick=()=>{P.forEach(q=>delete answers[q.id]);store.set(AK,answers);st.wrongOnly=false;render()};
      $('#wrongOnly').onclick=()=>{st.wrongOnly=!st.wrongOnly;st.shown=40;render()};};
    if(V.length>st.shown){more.innerHTML=`<button class="act ghost" id="mbtn">הצגת עוד ${Math.min(40,V.length-st.shown)} שאלות (מוצגות ${st.shown} מתוך ${V.length})</button>`;$('#mbtn').onclick=()=>{st.shown+=40;render()}}
  } else if(st.mode==='bank'){
    const P=pool(); list.onclick=null;
    $('#modeNote').textContent='כל השאלות עם התשובה הנכונה וההסבר.';
    list.innerHTML=P.map((q,i)=>card(q,i+1,{pick:null,reveal:true,locked:true,bank:true})).join('');
  } else {
    list.onclick=null;
    const key = st.exam? 'sim'+st.exam : 'random';
    if(!exam || exam.key!==key){
      let ids;
      if(st.exam) ids=EXAMS[st.exam-1].slice();
      else { const P=pool(); ids=P.map(q=>q.id).sort(()=>Math.random()-.5).slice(0,20); }
      exam={key,ids,picks:{},done:false};
    }
    $('#modeNote').textContent = st.exam? `סימולציה ${st.exam}: 20 שאלות מכל 9 הנושאים, 5 נקודות לשאלה – כמו במבחן.` : '20 שאלות אקראיות לפי הנושא והסוג שבחרת · 5 נקודות לשאלה.';
    const qs=exam.ids.map(id=>QS[id-1]);
    if(!qs.length){list.innerHTML='<p class="empty">אין שאלות שמתאימות לסינון הזה.</p>';return}
    const answered=Object.keys(exam.picks).length;
    if(exam.done){
      const right=qs.filter(q=>exam.picks[q.id]===q.ans).length;
      const by={}; qs.forEach(q=>{by[q.topic]=by[q.topic]||[0,0];by[q.topic][1]++; if(exam.picks[q.id]===q.ans)by[q.topic][0]++;});
      const bd=Object.entries(by).map(([t,[r,n]])=>`<span>${esc(t)}: <b>${r}/${n}</b></span>`).join('');
      top.innerHTML=`<div class="round"><div><div class="big">${Math.round(right/qs.length*100)}</div><div class="note">ציון (מתוך 100)</div></div><div>${right} תשובות נכונות מתוך ${qs.length}${st.exam&&scores['best'+st.exam]!=null?`<br>הציון הגבוה שלך בסימולציה הזו: <b>${scores['best'+st.exam]}</b>`:''}</div><div class="grow"><button class="act" id="again">${st.exam?'לפתור שוב':'מבחן אקראי חדש'}</button></div><div class="breakdown">${bd}</div></div>`;
      $('#again').onclick=()=>{exam=null;render();window.scrollTo(0,0)};
    } else {
      top.innerHTML=`<div class="round"><div>ענית על <b id="ans">${answered}</b> מתוך ${qs.length}</div><div class="grow"><button class="act" id="submit">הגשה וציון</button>${st.exam?'':'<button class="act ghost" id="newex">החלפת שאלות</button>'}</div><div class="bar"><i id="pbar" style="width:${pct(answered,qs.length)}%"></i></div></div>`;
      $('#submit').onclick=()=>{exam.done=true;
        if(st.exam){const sc=Math.round(qs.filter(q=>exam.picks[q.id]===q.ans).length/qs.length*100);
          scores['sim'+st.exam]=sc; scores['best'+st.exam]=Math.max(sc,scores['best'+st.exam]||0); store.set(SK,scores);}
        render();window.scrollTo(0,0)};
      const ne=$('#newex'); if(ne) ne.onclick=()=>{exam=null;render()};
    }
    list.innerHTML=qs.map((q,i)=>card(q,i+1,{pick:exam.picks[q.id],reveal:exam.done,locked:exam.done})).join('');
    if(!exam.done) list.onclick=e=>{const b=e.target.closest('.opt');if(!b)return;
      exam.picks[b.dataset.q]=+b.dataset.i;
      b.closest('.opts').querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));
      const n=Object.keys(exam.picks).length; $('#ans').textContent=n; $('#pbar').style.width=pct(n,qs.length)+'%';};
  }
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{st.mode=b.dataset.mode;st.shown=40;st.wrongOnly=false;render()});
document.querySelectorAll('#kinds .chip').forEach(b=>b.onclick=()=>{st.kind=b.dataset.kind;st.shown=40;if(st.mode==='exam')exam=null;render()});
render();
})();
</script>

</body>
</html>
